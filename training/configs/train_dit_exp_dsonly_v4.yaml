# =============================================================================
# Experiment: DS-Only v4 — nn.Embedding for adaLN, NO physics
# =============================================================================
# Changes from v3:
#   - Replaced MLP cap_embedder with nn.Embedding(num_ds+1, adaln_dim)
#     MLP was collapsing all DS inputs to similar outputs (cos>0.9 at 20k)
#     nn.Embedding has independent rows per class → structural separation
#   - Physics loss DISABLED (lambda_physics=0) — pure CFM, isolate DS fix
#
# Usage:
#   python train_picfm_DiT.py --config configs/train_dit_exp_dsonly_v4.yaml
# =============================================================================

# ---- Data -------------------------------------------------------------------
data:
  data_dirs:
    - data/mechanism_dataset:topopt
    - data/finray_dataset:finray
    - data/graph_dataset:graph
  max_samples: null

# ---- Model ------------------------------------------------------------------
model:
  hidden_dim: 384
  depth: 12
  num_heads: 6
  patch_size: 4
  mlp_ratio: 4.0
  bc_channels: 6
  num_design_spaces: 4
  n_concept_layers: 2
  n_concept_heads: 6
  drop_path_rate: 0.0
  dropout: 0.0
  bc_token_mode: ds_only

# ---- Flow Matching ----------------------------------------------------------
flow_matching:
  sigma: 0.
  type: otcfm
  timestep_sampling: lognormal

# ---- Physics Loss (DISABLED) ------------------------------------------------
physics:
  lambda_physics: 0
  physics_start_iter: 999999
  physics_ramp_iters: 0
  physics_min_t: 0.5
  physics_every: 1
  physics_batch_size: 64
  w_mechanism: 0.0
  w_binary: 0.0
  w_compliance: 0.0
  w_tv: 0.0
  penal: 5.0
  rmin: 0.5
  E_min: 1.0e-4

# ---- Training ----------------------------------------------------------------
training:
  batch_size: 128
  lr: 1.0e-4
  grad_clip: 1.0
  total_steps: 50000
  warmup: 2000
  ema_decay: 0.9999
  ema_start: 1000
  cond_drop_prob: 0.1
  cfg_scale: 3.0
  training_stage: 0
  disable_ds_tokens: false
  freeze_backbone: false
  stage1_checkpoint: null
  pretrained_encoder: trained_models/encoder_v11/encoder_best.pt
  freeze_encoder: true
  lambda_cls: 0.0
  encoder_lr_scale: 0.1
  lambda_diversity: 0.0
  contrastive_margin: 0.01
  ds_classifier_path: null
  lambda_ds_cls: 0.0

# ---- Logging / Saving --------------------------------------------------------
logging:
  log_freq: 20
  eval_freq: 500
  sample_freq: 5000
  save_freq: 10000
  n_ode_steps: 100
  n_sample_vis: 4

output:
  output_dir: trained_models/picfm
  run_name: run_dit_exp_dsonly_v4
  num_workers: 4
  wandb: false
