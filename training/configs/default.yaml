# =============================================================================
# PICFM Training Configuration
# =============================================================================
# Override any value via CLI:  python train_picfm.py --config configs/default.yaml --lr 1e-5
# Or create a new YAML and point to it:  python train_picfm.py --config configs/my_run.yaml

# ---- Data -------------------------------------------------------------------
data:
  # Single dataset (used when data_dirs is null):
  data_dir: data/mechanism_dataset
  # Multi-dataset: list of "path:label" entries (overrides data_dir when set)
  data_dirs: null
  # data_dirs:
  #   - data/mechanism_dataset:topopt
  #   - data/finray_dataset:finray
  max_samples: null                # null = use all samples; set integer for debugging

# ---- Model (UNet) -----------------------------------------------------------
model:
  model_channels: 64
  channel_mult: [1, 2, 3, 4]
  num_res_blocks: 2
  attention_resolutions: "16,8"    # comma-separated downsampled spatial sizes
  dropout: 0.0

# ---- Flow Matching ----------------------------------------------------------
flow_matching:
  sigma: 0.                       # 0 = deterministic OT path
  type: otcfm                      # otcfm | icfm

# ---- Physics Loss ------------------------------------------------------------
physics:
  lambda_physics: 1              # global weight for physics loss
  physics_start_iter: 500         # start adding physics after this iteration
  physics_ramp_iters: 10000        # linearly ramp physics weight over this many iters
  physics_min_t: 0.5               # skip physics for t < this (noisy structures)
  physics_every: 1                 # compute physics every N iterations
  physics_batch_size: 64            # max samples per FEM solve (chunks to save VRAM)

  # Sub-loss weights inside ResidualMechanics
  w_mechanism: 1.0
  w_binary: 1.0
  w_compliance: 0.1
  w_tv: 0.05                       # total-variation loss (connectivity)

  # SIMP / FEM parameters
  penal: 5.0                       # SIMP penalisation exponent
  rmin: 0.5                        # density filter radius (0.5 ≈ no smoothing)
  E_min: 1.0e-4                    # minimum Young's modulus

# ---- Training ----------------------------------------------------------------
training:
  batch_size: 64
  lr: 2.0e-4
  grad_clip: 1.0
  total_steps: 400000
  warmup: 500
  ema_decay: 0.9999
  ema_start: 1000

# ---- Logging / Saving --------------------------------------------------------
logging:
  log_freq: 20
  eval_freq: 500
  sample_freq: 10000
  save_freq: 10000
  n_ode_steps: 100                 # Euler ODE steps for sampling
  n_sample_vis: 4

# ---- Output / Run ------------------------------------------------------------
output:
  output_dir: ./trained_models/picfm
  run_name: run_combined_1
  resume: null                     # path to checkpoint .pt file, or null
  finetune: null                   # path to checkpoint for weight-only loading (fresh optimizer)
  num_workers: 4
  wandb: false
